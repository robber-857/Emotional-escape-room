<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="arch" x1="250" y1="434" x2="338" y2="149" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B602D" stop-opacity=".18"/>
      <stop offset=".28" stop-color="#D19B51" stop-opacity=".7"/>
      <stop offset=".67" stop-color="#FFDEA0"/>
      <stop offset="1" stop-color="#FFF0C7"/>
    </linearGradient>
    <linearGradient id="inside" x1="304" y1="149" x2="302" y2="451" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D6A15D" stop-opacity=".065"/>
      <stop offset=".48" stop-color="#A67132" stop-opacity=".035"/>
      <stop offset="1" stop-color="#171411" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stem" x1="220" y1="437" x2="226" y2="325" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79623B" stop-opacity=".25"/>
      <stop offset=".7" stop-color="#988152" stop-opacity=".72"/>
      <stop offset="1" stop-color="#B4A16C" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="24" y2="-30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17231B"/>
      <stop offset=".55" stop-color="#3E4934"/>
      <stop offset="1" stop-color="#71704A"/>
    </linearGradient>
    <linearGradient id="leafOlive" x1="0" y1="0" x2="24" y2="-31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#282B1B"/>
      <stop offset=".6" stop-color="#636141"/>
      <stop offset="1" stop-color="#B1A56B"/>
    </linearGradient>
    <linearGradient id="leafGold" x1="0" y1="0" x2="22" y2="-34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4D3B22"/>
      <stop offset=".52" stop-color="#A78A51"/>
      <stop offset="1" stop-color="#DDC38A"/>
    </linearGradient>
    <radialGradient id="floor">
