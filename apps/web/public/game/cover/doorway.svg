      <stop offset=".13" stop-color="#FFE4A7" stop-opacity=".93"/>
      <stop offset=".4" stop-color="#E3A459" stop-opacity=".45"/>
      <stop offset="1" stop-color="#DB9450" stop-opacity="0"/>
    </radialGradient>
    <filter id="archGlow" x="-70%" y="-30%" width="240%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="floorBlur" x="-30%" y="-150%" width="160%" height="400%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <path id="archPath" d="M249 447V201C249 168.4 272.4 142 301 142S353 168.4 353 201V447"/>
    <g id="greenLeaf">
      <path d="M0 0C-1-13 7-28 22-34C25-20 19-8 0 0Z" fill="url(#leafGreen)"/>
      <path d="M1-1L20-31" stroke="#9A9770" stroke-opacity=".15" stroke-width=".7"/>
    </g>
    <g id="oliveLeaf">
      <path d="M0 0C-1-13 7-28 22-34C25-20 19-8 0 0Z" fill="url(#leafOlive)"/>
      <path d="M1-1L20-31" stroke="#C1B180" stroke-opacity=".19" stroke-width=".7"/>
    </g>
    <g id="goldLeaf">
